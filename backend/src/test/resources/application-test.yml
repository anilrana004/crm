spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/securetravels_test
    username: postgres
    password: ""
  flyway:
    clean-disabled: false

app:
  login-rate-limit:
    capacity: 10000
    refill-per-window: 10000
    window-minutes: 15
  webhook:
    rate-limit:
      capacity: 10000
      refill-per-window: 10000
      window-minutes: 1
  bootstrap-demo-data: false
  whatsapp:
    # Pinned explicitly rather than inherited from the AppProperties default, so
    # WhatsAppCommunicationIT signs with the same value and cannot silently pass
    # if that default changes.
    mode: SANDBOX
    webhook-secret: test-interakt-webhook-secret
    country-code: "+91"
  messaging:
    # Keep the inline retry loop instant; a retryable-failure test must not sleep.
    max-attempts: 3
    retry-backoff-millis: 1

logging:
  level:
    org.hibernate.SQL: OFF