spring:
  jpa:
    show-sql: false

app:
  bootstrap-demo-data: false

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Phase 3 Module 5. health stays first because the VPS load balancer
        # polls it on the app port; prometheus is scraped from the host network
        # only and must be denied at Nginx (docs/OBSERVABILITY.md) -- this
        # endpoint has no authentication of its own and reveals queue names,
        # pool sizes and route paths.
        include: health,prometheus
  metrics:
    tags:
      application: securetravels
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.hibernate.SQL: OFF