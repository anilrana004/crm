spring:
  application:
    name: securetravels
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/securetravels_crm}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:securetravels-phase1-jwt-secret-change-me-32b-plus}
    access-minutes: 15
    refresh-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  login-rate-limit:
    capacity: 5
    refill-per-window: 5
    window-minutes: 15
  discount:
    max-auto-approve-percent: ${DISCOUNT_AUTO_APPROVE_PERCENT:5.00}
  webhook:
    secret: ${WEBHOOK_SECRET:dev-webhook-secret-insecure-change-me}
    rate-limit:
      capacity: 20
      refill-per-window: 20
      window-minutes: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL:OFF}
    org.flywaydb: info